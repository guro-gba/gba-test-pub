name: Build ROM

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Install Python
        run: apt-get update && apt-get install -y --no-install-recommends python3

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: "*.gba"
